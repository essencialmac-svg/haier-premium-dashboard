# =====================================================================
#  Haier Premium Dashboard para Home Assistant
#  https://github.com/essencialmac-svg/haier-premium-dashboard
#
#  Antes de pegar, sustituye estos marcadores (Buscar y reemplazar):
#    climate.TU_AIRE            -> tu entidad climate (SmartIR)
#    remote.TU_BROADLINK        -> tu mando Broadlink (remote.xxx)
#    switch.TU_ENCHUFE          -> enchufe con medición (opcional)
#    sensor.TU_CONSUMO_ACTUAL   -> potencia actual en W (opcional)
#    sensor.TU_CONSUMO_HOY      -> energía de hoy en kWh (opcional)
#    sensor.TU_CONSUMO_MES      -> energía del mes en kWh (opcional)
#  y en la tarjeta de cabecera: TU-MODELO, TU-NUMERO-DE-SERIE y fechas.
#
#  "Haier" (device: Haier) es el nombre del dispositivo con el que
#  aprendiste los códigos IR en el Broadlink. Ver docs/BROADLINK.md
#
#  Requiere: button-card (HACS). Ver docs/INSTALLATION.md
# =====================================================================
title: Haier Premium
views:
- type: sections
  max_columns: 4
  title: Haier-Premium
  path: haier-premium
  icon: mdi:air-conditioner
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: vertical-stack
      cards:
      - type: custom:button-card
        entity: climate.TU_AIRE
        show_icon: false
        show_name: false
        show_label: false
        tap_action:
          action: more-info
        styles:
          card:
          - border-radius: 26px
          - padding: 18px
          - color: white
          - overflow: hidden
          - background: |
              [[[
                const s = entity.state;
                if (s === 'heat') return 'linear-gradient(135deg,#24120a 0%,#123049 45%,#05253c 100%)';
                if (s === 'dry') return 'linear-gradient(135deg,#071f34 0%,#063c50 45%,#052136 100%)';
                if (s === 'fan_only') return 'linear-gradient(135deg,#071f34 0%,#0b4a47 45%,#052136 100%)';
                if (s === 'off') return 'linear-gradient(135deg,#1f2b38 0%,#172332 55%,#0c1520 100%)';
                return 'linear-gradient(135deg,#061a2d 0%,#063d63 45%,#052136 100%)';
              ]]]
          - border: 1px solid rgba(100,180,255,.25)
          - box-shadow: 0 16px 45px rgba(0,0,0,.48)
          grid:
          - grid-template-areas: '''pic title power'' ''pic state mini'' ''info info info'''
          - grid-template-columns: minmax(368px, 48%) 1fr 58px
          - grid-template-rows: min-content min-content min-content
          - gap: 8px 14px
          custom_fields:
            pic:
            - align-self: center
            title:
            - justify-self: start
            - align-self: end
            state:
            - justify-self: start
            - align-self: start
            power:
            - justify-self: end
            - align-self: start
            mini:
            - justify-self: end
            - align-self: center
            info:
            - margin-top: 14px
        custom_fields:
          pic: |
            [[[
              return `<div class="ac-photo">
                <img src="/local/haier/haier_split_dashboard.png" alt="Aire acondicionado">
              </div>`;
            ]]]
          title: |
            [[[
              return `<div class="brand">Haier</div><div class="name">Aire Dormitorio</div>`;
            ]]]
          state: |
            [[[
              const on = entity.state !== 'off';
              const mode = {cool:'Frío',heat:'Calor',dry:'Seco',fan_only:'Ventilador',off:'Apagado'}[entity.state] ?? entity.state;
              return `<div class="status"><span class="dot ${on ? 'on' : 'off'}"></span>${on ? 'Encendido' : 'Apagado'} <span class="sep">|</span> ${mode}</div>`;
            ]]]
          power:
            card:
              type: custom:button-card
              entity: climate.TU_AIRE
              icon: mdi:power
              show_name: true
              name: |
                [[[
                  const e = states['climate.TU_AIRE'];
                  return e && e.state === 'off' ? 'ON' : 'OFF';
                ]]]
              tap_action:
                action: call-service
                service: |
                  [[[
                    const e = states['climate.TU_AIRE'];
                    return e && e.state === 'off' ? 'climate.set_hvac_mode' : 'climate.turn_off';
                  ]]]
                target:
                  entity_id: climate.TU_AIRE
                data: |
                  [[[
                    const e = states['climate.TU_AIRE'];
                    return e && e.state === 'off' ? {hvac_mode: 'cool'} : {};
                  ]]]
              styles:
                card:
                - width: 54px
                - height: 54px
                - border-radius: 18px
                - background: |
                    [[[
                      const e = states['climate.TU_AIRE'];
                      return e && e.state === 'off'
                        ? 'rgba(255,255,255,.12)'
                        : 'linear-gradient(135deg,#1688ff,#006cff)';
                    ]]]
                - border: 1px solid rgba(255,255,255,.18)
                - box-shadow: 0 8px 20px rgba(0,0,0,.35)
                icon:
                - color: white
                - width: 28px
                name:
                - color: white
                - font-size: 10px
                - font-weight: 800
                - margin-top: -4px
          mini: |
            [[[
              return `<div class="mini"><ha-icon icon="mdi:wifi"></ha-icon><ha-icon icon="mdi:leaf"></ha-icon><ha-icon icon="mdi:snowflake"></ha-icon></div>`;
            ]]]
          info: |
            [[[
              return `<div class="info-grid">
                <div><ha-icon icon="mdi:tag-outline"></ha-icon><span>Modelo</span><b>TU-MODELO</b></div>
                <div><ha-icon icon="mdi:barcode-scan"></ha-icon><span>Serie</span><b>TU-NUMERO-DE-SERIE</b></div>
                <div><ha-icon icon="mdi:calendar-check"></ha-icon><span>Comprado</span><b>1 ene 2025</b></div>
                <div><ha-icon icon="mdi:calendar-star"></ha-icon><span>Registrado</span><b>1 ene 2025</b></div>
              </div>`;
            ]]]
        extra_styles: |
          .brand { color:#2d9cff; font-weight:900; font-size:22px; line-height:22px; }
          .name { font-size:32px; font-weight:900; margin-top:5px; letter-spacing:-.8px; }
          .status { color:rgba(255,255,255,.82); font-size:16px; display:flex; align-items:center; gap:8px; }
          .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
          .dot.on { background:#4ce37b; box-shadow:0 0 12px rgba(76,227,123,.8); }
          .dot.off { background:#8a929a; }
          .sep { color:rgba(255,255,255,.45); margin:0 4px; }
          .ac-photo { position:relative; width:115%; max-width:644px; min-width:299px; margin:0 auto; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 16px 20px rgba(0,0,0,.42)); }
          .ac-photo img { display:block; width:100%; height:auto; max-height:253px; object-fit:contain; object-position:center; border-radius:12px; }
          .mini { display:flex; gap:8px; }
          .mini ha-icon { width:42px; height:42px; padding:10px; box-sizing:border-box; color:#81d7ff; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); }
          .info-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
          .info-grid div { display:grid; grid-template-columns:28px 1fr; grid-template-areas:'i s' 'i b'; column-gap:7px; align-items:center; padding:8px 10px; border-radius:15px; background:rgba(255,255,255,.045); }
          .info-grid ha-icon { grid-area:i; width:22px; color:#bfd5e7; }
          .info-grid span { grid-area:s; color:#c7d2df; font-size:13px; }
          .info-grid b { grid-area:b; color:#eaf4ff; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          @media (max-width: 900px) { #container { grid-template-columns:minmax(253px,44%) 1fr 58px !important; } .ac-photo { width:115%; min-width:242px; } .ac-photo img { max-height:190px; } }
          @media (max-width: 600px) { #container { grid-template-areas:'pic power' 'title title' 'state mini' 'info info' !important; grid-template-columns:1fr 58px !important; } .ac-photo { width:115%; min-width:0; max-width:368px; justify-self:start; } .ac-photo img { max-height:167px; } .info-grid { grid-template-columns:repeat(2,1fr); } .name { font-size:26px; } }
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          entity: climate.TU_AIRE
          show_name: false
          show_icon: false
          tap_action:
            action: more-info
          styles:
            card:
            - border-radius: 26px
            - padding: 24px 18px
            - color: white
            - min-height: 330px
            - background: radial-gradient(circle at 50% 25%, rgba(35,132,210,.42), rgba(5,24,42,.96) 68%)
            - border: 1px solid rgba(100,180,255,.25)
            - box-shadow: 0 16px 45px rgba(0,0,0,.45)
            grid:
            - grid-template-areas: '''dial'' ''buttons'''
            - grid-template-rows: 1fr min-content
          custom_fields:
            dial: |
              [[[
                const e = states['climate.TU_AIRE'];
                const a = e ? e.attributes : {};
                const temp = a.temperature ?? '--';
                const cur = a.current_temperature ?? '--';
                const hum = a.current_humidity ?? '--';
                const s = e ? e.state : 'off';
                const col = s === 'heat' ? '#ff9c38' : s === 'dry' ? '#00d8ff' : s === 'fan_only' ? '#58df83' : s === 'off' ? '#7e8790' : '#238dff';
                const label = {cool:'Frío',heat:'Calor',dry:'Seco',fan_only:'Ventilador',off:'Apagado'}[s] ?? s;
                return `<div class="dial-wrap" style="--mode:${col}">
                  <div class="arc"></div>
                  <div class="knob"></div>
                  <div class="dial-text"><div class="small">Temperatura actual</div><div class="current">${cur}<span>&nbsp;&deg;C</span></div><div class="small mode">${label}</div><div class="target">${temp}<span>&nbsp;&deg;C</span></div><div class="hum"><ha-icon icon="mdi:water-percent"></ha-icon> ${hum}%</div></div>
                </div>`;
              ]]]
            buttons:
              card:
                type: grid
                columns: 2
                square: false
                cards:
                - type: custom:button-card
                  icon: mdi:minus
                  show_name: false
                  tap_action:
                    action: call-service
                    service: climate.set_temperature
                    target:
                      entity_id: climate.TU_AIRE
                    data:
                      temperature: |
                        [[[
                          const t = states['climate.TU_AIRE'].attributes.temperature || 22;
                          return Math.max(16, t - 1);
                        ]]]
                  styles:
                    card:
                    - border-radius: 18px
                    - height: 50px
                    - background: rgba(255,255,255,.12)
                    - border: 1px solid rgba(255,255,255,.14)
                    icon:
                    - color: white
                    - width: 28px
                - type: custom:button-card
                  icon: mdi:plus
                  show_name: false
                  tap_action:
                    action: call-service
                    service: climate.set_temperature
                    target:
                      entity_id: climate.TU_AIRE
                    data:
                      temperature: |
                        [[[
                          const t = states['climate.TU_AIRE'].attributes.temperature || 22;
                          return Math.min(30, t + 1);
                        ]]]
                  styles:
                    card:
                    - border-radius: 18px
                    - height: 50px
                    - background: rgba(255,255,255,.12)
                    - border: 1px solid rgba(255,255,255,.14)
                    icon:
                    - color: white
                    - width: 28px
          extra_styles: |
            .dial-wrap { position:relative; width:270px; height:270px; margin:0 auto 10px; border-radius:50%; background:radial-gradient(circle at 40% 32%,rgba(255,255,255,.20),rgba(255,255,255,.04) 56%,rgba(0,0,0,.18)); box-shadow:inset 0 0 45px rgba(255,255,255,.10), 0 18px 35px rgba(0,0,0,.28); }
            .arc { position:absolute; inset:0; border-radius:50%; background:conic-gradient(var(--mode) 0deg 250deg, rgba(255,255,255,.20) 250deg 360deg); -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px)); mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px)); }
            .knob { position:absolute; width:22px; height:22px; border-radius:50%; background:#f5f8ff; left:55px; top:11px; box-shadow:0 3px 10px rgba(0,0,0,.35); }
            .dial-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
            .small { color:#cdd8e7; font-size:13px; }
            .current { font-family:'Courier New',Consolas,monospace; font-size:68px; font-weight:800; letter-spacing:-4px; line-height:76px; font-variant-numeric:tabular-nums; text-shadow:0 0 6px rgba(255,255,255,.32),0 0 16px color-mix(in srgb,var(--mode) 60%,transparent); }
            .current span { font-family:Arial,Helvetica,sans-serif; font-size:25px; margin-left:5px; letter-spacing:0; }
            .mode { color:var(--mode); margin-top:2px; }
            .target { font-family:'Courier New',Consolas,monospace; font-size:42px; color:var(--mode); font-weight:800; line-height:48px; font-variant-numeric:tabular-nums; text-shadow:0 0 7px color-mix(in srgb,var(--mode) 80%,transparent); }
            .target span { font-family:Arial,Helvetica,sans-serif; font-size:19px; margin-left:3px; letter-spacing:0; }
            .hum { margin-top:4px; font-size:14px; color:#c8d8e9; display:flex; align-items:center; gap:4px; justify-content:center; } .hum ha-icon { width:16px; height:16px; color:#5bb6ff; }
        - type: vertical-stack
          cards:
          - type: custom:button-card
            show_icon: false
            show_name: false
            styles:
              card:
              - border-radius: 26px
              - padding: 20px
              - min-height: 330px
              - color: white
              - background: linear-gradient(145deg,rgba(5,37,62,.95),rgba(4,24,42,.96))
              - border: 1px solid rgba(100,180,255,.25)
              - box-shadow: 0 16px 45px rgba(0,0,0,.45)
              grid:
              - grid-template-areas: '''modes'' ''fan'' ''swing'''
              - gap: 14px
            custom_fields:
              modes:
                card:
                  type: vertical-stack
                  cards:
                  - type: custom:button-card
                    name: Modo
                    show_icon: false
                    styles:
                      card:
                      - background: none
                      - box-shadow: none
                      - padding: 0
                      name:
                      - justify-self: start
                      - color: white
                      - font-size: 17px
                  - type: grid
                    columns: 5
                    square: false
                    cards:
                    - type: custom:button-card
                      entity: climate.TU_AIRE
                      name: 'Off'
                      icon: mdi:power
                      tap_action:
                        action: call-service
                        service: climate.turn_off
                        target:
                          entity_id: climate.TU_AIRE
                      styles:
                        card:
                        - border-radius: 16px
                        - height: 78px
                        - background: rgba(255,255,255,.06)
                        - border: 1px solid rgba(255,255,255,.10)
                        icon:
                        - color: '#d8e2ee'
                        name:
                        - color: '#d8e2ee'
                        - font-size: 13px
                    - type: custom:button-card
                      entity: climate.TU_AIRE
                      name: Frío
                      icon: mdi:snowflake
                      tap_action:
                        action: call-service
                        service: climate.set_hvac_mode
                        target:
                          entity_id: climate.TU_AIRE
                        data:
                          hvac_mode: cool
                      styles:
                        card:
                        - border-radius: 16px
                        - height: 78px
                        - background: rgba(255,255,255,.06)
                        - border: 1px solid rgba(255,255,255,.10)
                        icon:
                        - color: '#d8e2ee'
                        name:
                        - color: '#d8e2ee'
                        - font-size: 13px
                      state:
                      - value: cool
                        styles:
                          card:
                          - background: linear-gradient(135deg,#1688ff,#006cff)
                          - box-shadow: 0 0 20px rgba(30,136,255,.45)
                    - type: custom:button-card
                      entity: climate.TU_AIRE
                      name: Seco
                      icon: mdi:water-outline
                      tap_action:
                        action: call-service
                        service: climate.set_hvac_mode
                        target:
                          entity_id: climate.TU_AIRE
                        data:
                          hvac_mode: dry
                      styles:
                        card:
                        - border-radius: 16px
                        - height: 78px
                        - background: rgba(255,255,255,.06)
                        - border: 1px solid rgba(255,255,255,.10)
                        icon:
                        - color: '#d8e2ee'
                        name:
                        - color: '#d8e2ee'
                        - font-size: 13px
                      state:
                      - value: dry
                        styles:
                          card:
                          - background: linear-gradient(135deg,#00b8d8,#006477)
                    - type: custom:button-card
                      entity: climate.TU_AIRE
                      name: Calor
                      icon: mdi:white-balance-sunny
                      tap_action:
                        action: call-service
                        service: climate.set_hvac_mode
                        target:
                          entity_id: climate.TU_AIRE
                        data:
                          hvac_mode: heat
                      styles:
                        card:
                        - border-radius: 16px
                        - height: 78px
                        - background: rgba(255,255,255,.06)
                        - border: 1px solid rgba(255,255,255,.10)
                        icon:
                        - color: '#d8e2ee'
                        name:
                        - color: '#d8e2ee'
                        - font-size: 13px
                      state:
                      - value: heat
                        styles:
                          card:
                          - background: linear-gradient(135deg,#ff9c38,#e34f12)
                    - type: custom:button-card
                      entity: climate.TU_AIRE
                      name: Vent.
                      icon: mdi:fan
                      tap_action:
                        action: call-service
                        service: climate.set_hvac_mode
                        target:
                          entity_id: climate.TU_AIRE
                        data:
                          hvac_mode: fan_only
                      styles:
                        card:
                        - border-radius: 16px
                        - height: 78px
                        - background: rgba(255,255,255,.06)
                        - border: 1px solid rgba(255,255,255,.10)
                        icon:
                        - color: '#d8e2ee'
                        name:
                        - color: '#d8e2ee'
                        - font-size: 13px
                      state:
                      - value: fan_only
                        styles:
                          card:
                          - background: linear-gradient(135deg,#43d976,#0a8754)
              fan:
                card:
                  type: vertical-stack
                  cards:
                  - type: custom:button-card
                    name: Velocidad del ventilador
                    show_icon: false
                    styles:
                      card:
                      - background: none
                      - box-shadow: none
                      - padding: 0
                      name:
                      - justify-self: start
                      - color: white
                      - font-size: 17px
                  - type: custom:button-card
                    entity: climate.TU_AIRE
                    name: |
                      [[[
                        const e = states['climate.TU_AIRE'];
                        const fm = e?.attributes?.fan_mode ?? 'auto';
                        const map = {low:'Caudal bajo', mid:'Caudal medio', high:'Caudal alto', auto:'Caudal automático'};
                        return map[fm] ?? fm;
                      ]]]
                    label: |
                      [[[
                        const e = states['climate.TU_AIRE'];
                        const on = e && e.state !== 'off';
                        const fm = e?.attributes?.fan_mode ?? '--';
                        const map = {low:'Baja',mid:'Media',high:'Alta',auto:'Auto'};
                        return on ? `Velocidad ${map[fm] ?? fm}` : 'Ventilador parado';
                      ]]]
                    show_label: true
                    icon: mdi:fan
                    custom_fields:
                      speed: |
                        [[[
                          const e = states['climate.TU_AIRE'];
                          const on = e && e.state !== 'off';
                          const fm = e?.attributes?.fan_mode ?? 'auto';
                          const count = !on ? 0 : ({low:1,mid:2,high:4,auto:3}[fm] ?? 2);
                          return `<div class="fan-meter">${[1,2,3,4].map(i =>
                            `<span class="${i <= count ? 'active' : ''}"></span>`).join('')}</div>`;
                        ]]]
                    styles:
                      card:
                      - border-radius: 20px
                      - height: 104px
                      - padding: 12px 16px
                      - overflow: hidden
                      - background: linear-gradient(135deg,rgba(22,136,255,.22),rgba(0,216,255,.09))
                      - border: 1px solid rgba(120,200,255,.25)
                      - box-shadow: inset 0 0 28px rgba(60,170,255,.12), 0 9px 25px rgba(0,0,0,.28)
                      grid:
                      - grid-template-areas: '''i n'' ''i l'' ''i speed'''
                      - grid-template-columns: 74px 1fr
                      - grid-template-rows: 1fr 1fr 16px
                      icon:
                      - color: |
                          [[[
                            const e = states['climate.TU_AIRE'];
                            if (!e || e.state === 'off') return '#7e8790';
                            if (e.state === 'heat') return '#ff9c38';
                            if (e.state === 'dry') return '#00d8ff';
                            if (e.state === 'fan_only') return '#58df83';
                            return '#5bb6ff';
                          ]]]
                      - width: 58px
                      - padding: 7px
                      - border-radius: 50%
                      - background: rgba(0,40,75,.22)
                      - border: 1px solid rgba(130,215,255,.22)
                      - filter: |
                          [[[
                            const e = states['climate.TU_AIRE'];
                            return e && e.state !== 'off'
                              ? 'drop-shadow(0 0 8px rgba(91,182,255,.9)) drop-shadow(0 0 18px rgba(0,145,255,.55))'
                              : 'none';
                          ]]]
                      - animation: |
                          [[[
                            const e = states['climate.TU_AIRE'];
                            if (!e || e.state === 'off') return 'none';
                            const fm = e.attributes?.fan_mode;
                            if (fm === 'low') return 'haier_fan_spin 4.2s linear infinite';
                            if (fm === 'mid') return 'haier_fan_spin 2.35s linear infinite';
                            if (fm === 'high') return 'haier_fan_spin .95s linear infinite';
                            if (fm === 'auto') return 'haier_fan_spin 1.75s linear infinite';
                            return 'haier_fan_spin 2.5s linear infinite';
                          ]]]
                      name:
                      - color: white
                      - justify-self: start
                      - align-self: end
                      - font-size: 17px
                      - font-weight: 750
                      label:
                      - color: '#9fd8ff'
                      - justify-self: start
                      - align-self: start
                      - font-size: 13px
                      custom_fields:
                        speed:
                        - justify-self: stretch
                        - align-self: center
                    extra_styles: |
                      @keyframes haier_fan_spin {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                      }
                      .fan-meter {
                        display:grid;
                        grid-template-columns:repeat(4,1fr);
                        gap:6px;
                        width:100%;
                        max-width:190px;
                      }
                      .fan-meter span {
                        height:5px;
                        border-radius:999px;
                        background:rgba(150,185,210,.18);
                        border:1px solid rgba(180,220,245,.10);
                        transition:all .25s ease;
                      }
                      .fan-meter span.active {
                        background:linear-gradient(90deg,#2a9cff,#5fe4ff);
                        border-color:rgba(130,230,255,.45);
                        box-shadow:0 0 8px rgba(70,190,255,.65);
                      }
                  - type: grid
                    columns: 4
                    square: false
                    cards:
                    - type: custom:button-card
                      entity: climate.TU_AIRE
                      name: Low
                      icon: mdi:fan-speed-1
                      tap_action:
                        action: call-service
                        service: climate.set_fan_mode
                        target:
                          entity_id: climate.TU_AIRE
                        data:
                          fan_mode: low
                      styles:
                        card:
                        - border-radius: 15px
                        - height: 52px
                        - background: rgba(255,255,255,.06)
                        - border: 1px solid rgba(255,255,255,.10)
                        icon:
                        - color: '#bcd1e5'
                        name:
                        - color: '#bcd1e5'
                        - font-size: 12px
                      state:
                      - operator: template
