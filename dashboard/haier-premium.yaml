        entity: switch.TU_ENCHUFE
        triggers_update:
        - switch.TU_ENCHUFE
        - sensor.TU_CONSUMO_ACTUAL
        - sensor.TU_CONSUMO_HOY
        - sensor.TU_CONSUMO_MES
        show_icon: false
        show_name: false
        show_label: false
        tap_action:
          action: none
        styles:
          card:
          - border-radius: 22px
          - padding: 18px
          - color: white
          - overflow: hidden
          - background: linear-gradient(145deg,rgba(6,57,91,.96),rgba(5,28,48,.96))
          - border: 1px solid rgba(100,180,255,.23)
          - box-shadow: 0 12px 35px rgba(0,0,0,.38)
          grid:
          - grid-template-areas: '''title power'' ''metrics metrics'''
          - grid-template-columns: 1fr 72px
          - grid-template-rows: min-content min-content
          - gap: 14px
          custom_fields:
            title:
            - justify-self: start
            - align-self: center
            power:
            - justify-self: end
            - align-self: center
            metrics:
            - width: 100%
        custom_fields:
          title: |
            [[[
              const sw = states['switch.TU_ENCHUFE'];
              const on = sw && sw.state === 'on';
              return `<div class="energy-title">
                <ha-icon icon="mdi:flash"></ha-icon>
                <div><b>Energía y consumo</b><span>Enchufe inteligente · ${on ? 'Conectado' : 'Apagado'}</span></div>
              </div>`;
            ]]]
          power:
            card:
              type: custom:button-card
              entity: switch.TU_ENCHUFE
              show_name: false
              show_label: false
              icon: mdi:power
              tap_action:
                action: toggle
              confirmation:
                text: ¿Cambiar el estado del enchufe del aire acondicionado?
              styles:
                card:
                - width: 58px
                - height: 58px
                - border-radius: 18px
                - background: |
                    [[[
                      const sw = states['switch.TU_ENCHUFE'];
                      return sw && sw.state === 'on'
                        ? 'linear-gradient(135deg,#1688ff,#006cff)'
                        : 'rgba(255,255,255,.10)';
                    ]]]
                - border: 1px solid rgba(255,255,255,.16)
                - box-shadow: |
                    [[[
                      const sw = states['switch.TU_ENCHUFE'];
                      return sw && sw.state === 'on'
                        ? '0 0 22px rgba(22,136,255,.45)'
                        : '0 8px 20px rgba(0,0,0,.28)';
                    ]]]
                icon:
                - color: white
                - width: 29px
          metrics: |
            [[[
              const formatSensor = (id, decimals = 2) => {
                const sensor = states[id];
                if (!sensor || ['unknown', 'unavailable', 'none', ''].includes(sensor.state)) {
                  return '--';
                }

                const numericValue = Number(sensor.state);
                const unit = sensor.attributes.unit_of_measurement || '';

                if (Number.isNaN(numericValue)) {
                  return `${sensor.state}${unit ? ' ' + unit : ''}`;
                }

                const value = new Intl.NumberFormat('es-ES', {
                  minimumFractionDigits: 0,
                  maximumFractionDigits: decimals
                }).format(numericValue);

                return `${value}${unit ? ' ' + unit : ''}`;
              };

              const currentSensor = states['sensor.TU_CONSUMO_ACTUAL'];
              const currentPower = currentSensor ? Number(currentSensor.state) : 0;
              const currentClass = currentPower >= 1500
                ? 'energy-high'
                : currentPower >= 800
                  ? 'energy-medium'
                  : 'energy-normal';

              return `<div class="energy-grid">
                <div class="${currentClass}"><ha-icon icon="mdi:lightning-bolt"></ha-icon><span>Consumo actual</span><b>${formatSensor('sensor.TU_CONSUMO_ACTUAL', 1)}</b></div>
                <div><ha-icon icon="mdi:calendar-today"></ha-icon><span>Consumo hoy</span><b>${formatSensor('sensor.TU_CONSUMO_HOY', 2)}</b></div>
                <div><ha-icon icon="mdi:calendar-month"></ha-icon><span>Este mes</span><b>${formatSensor('sensor.TU_CONSUMO_MES', 2)}</b></div>
              </div>`;
            ]]]
        extra_styles: |
          .energy-title { display:flex; align-items:center; gap:12px; }
          .energy-title > ha-icon { width:34px; height:34px; color:#61baff; padding:9px; border-radius:14px; background:rgba(22,136,255,.14); border:1px solid rgba(100,180,255,.20); box-sizing:content-box; }
          .energy-title b { display:block; font-size:19px; color:white; }
          .energy-title span { display:block; margin-top:3px; font-size:13px; color:#9fb3c8; }
          .energy-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
          .energy-grid div { display:grid; grid-template-columns:36px 1fr; grid-template-areas:'i s' 'i b'; column-gap:9px; align-items:center; padding:13px 14px; border-radius:16px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09); }

          .energy-grid .energy-normal b { color:#eaf4ff; }
          .energy-grid .energy-medium { border-color:rgba(255,177,64,.38); box-shadow:inset 0 0 22px rgba(255,177,64,.08); }
          .energy-grid .energy-medium b, .energy-grid .energy-medium ha-icon { color:#ffbd59; }
          .energy-grid .energy-high { border-color:rgba(255,82,82,.48); box-shadow:inset 0 0 24px rgba(255,82,82,.12), 0 0 18px rgba(255,82,82,.08); }
          .energy-grid .energy-high b, .energy-grid .energy-high ha-icon { color:#ff6b6b; }
          .energy-grid ha-icon { grid-area:i; width:27px; color:#7fc9ff; }
          .energy-grid span { grid-area:s; color:#9fb3c8; font-size:13px; }
          .energy-grid b { grid-area:b; color:white; font-size:19px; font-weight:800; margin-top:2px; }
          @media (max-width: 700px) { .energy-grid { grid-template-columns:1fr; } .energy-grid div { min-height:48px; } }
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          entity: climate.TU_AIRE
          show_icon: false
          show_name: false
          styles:
            card: &id001
            - border-radius: 22px
            - padding: 16px 18px
            - min-height: 160px
            - background: linear-gradient(145deg,rgba(6,57,91,.96),rgba(5,28,48,.96))
            - border: 1px solid rgba(100,180,255,.23)
            - color: white
            - box-shadow: 0 12px 35px rgba(0,0,0,.38)
          custom_fields:
            content: |
              [[[
                const e = states['climate.TU_AIRE'];
                const a = e ? e.attributes : {};
                const st = e ? e.state : '--';
                return `<div class="rt"><div class="h">Estado en tiempo real</div>
                  <div><span><ha-icon icon="mdi:thermometer"></ha-icon> Temperatura ambiente</span><b>${a.current_temperature ?? '--'} &deg;C</b></div>
                  <div><span><ha-icon icon="mdi:water-percent"></ha-icon> Humedad ambiente</span><b>${a.current_humidity ?? '--'} %</b></div>
                  <div><span><ha-icon icon="mdi:fan"></ha-icon> Ventilador</span><b>${a.fan_mode ?? '--'}</b></div>
                  <div><span><ha-icon icon="mdi:air-conditioner"></ha-icon> Modo</span><b>${st}</b></div>
                  <small>Actualización según entidad climate</small></div>`;
              ]]]
          extra_styles: |
            .rt .h { font-size:18px; font-weight:700; margin-bottom:12px; }
            .rt div:not(.h) { display:flex; justify-content:space-between; padding:6px 0; color:#c8d8e9; } .rt span { display:flex; align-items:center; gap:6px; } .rt span ha-icon { width:18px; height:18px; color:#5bb6ff; }
            .rt b { color:white; font-weight:500; }
            .rt small { display:block; margin-top:12px; color:#9fb3c8; }
        - type: custom:button-card
          show_icon: false
          show_name: false
          styles:
