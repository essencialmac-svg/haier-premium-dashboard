          custom_fields:
            content: |
              <div class="prog">
                <div class="h">Programación</div>
                <div class="row"><ha-icon icon="mdi:calendar-clock"></ha-icon><div><b>Próximo evento</b><span>Sleep · 23:00 · 24°C · Silencio</span></div><ha-icon icon="mdi:chevron-right"></ha-icon></div>
                <div class="row"><ha-icon icon="mdi:calendar-week"></ha-icon><div><b>Programación semanal</b><span>Activada</span></div><ha-icon icon="mdi:chevron-right"></ha-icon></div>
              </div>
          extra_styles: |
            .prog .h { font-size:18px; font-weight:700; margin-bottom:12px; }
            .row { display:grid; grid-template-columns:32px 1fr 22px; align-items:center; gap:9px; padding:12px; border-radius:15px; background:rgba(255,255,255,.055); margin-bottom:10px; }
            .row ha-icon { color:#c8d8e9; width:24px; }
            .row b { display:block; font-size:15px; }
            .row span { display:block; color:#9fb3c8; font-size:13px; margin-top:3px; }
      grid_options:
        columns: full
        rows: auto
