    - delay: "00:00:01"
    - action: climate.set_temperature
      target:
        entity_id: climate.TU_AIRE
      data:
        temperature: 18
    - delay: "00:00:01"
    - action: climate.set_fan_mode
      target:
        entity_id: climate.TU_AIRE
      data:
        fan_mode: high
    - delay: "00:00:01"
    - action: remote.send_command
      target:
        entity_id: remote.TU_BROADLINK
      data:
        device: Haier
        command:
          - turbo
          - swing_vertical
          - swing_horizontal
        delay_secs: 1

